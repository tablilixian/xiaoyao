<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读 - 逍遥小散仙</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --bg-hover: #22222f;
            --text-primary: #e8e4dc;
            --text-secondary: #a09888;
            --text-muted: #666;
            --accent-gold: #d4a574;
            --accent-jade: #5a9a8f;
            --border-color: #2a2a3a;
            --font-size-base: 18px;
            --line-height: 2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: var(--line-height);
            font-size: var(--font-size-base);
        }

        /* 头部导航 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }

        header.hidden {
            transform: translateY(-100%);
        }

        .header-content {
            max-width: 100%;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--accent-gold);
        }

        .current-position {
            font-size: 14px;
            color: var(--accent-gold);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
        }

        .icon-btn:hover {
            background: rgba(212, 165, 116, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* 主内容区 */
        .main-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 30px 150px;
        }

        /* 章节标题 */
        .chapter-header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .chapter-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 15px;
            letter-spacing: 5px;
        }

        .chapter-meta {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* 章节内容 */
        .chapter-content {
            text-align: justify;
            text-indent: 2em;
        }

        .chapter-content p {
            margin-bottom: 1.5em;
            line-height: 2;
        }

        /* 章节图片 */
        .chapter-image {
            display: block;
            max-width: 100%;
            margin: 30px auto;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .image-caption {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* 章节导航 */
        .chapter-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(212, 165, 116, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn.prev::before {
            content: '←';
        }

        .nav-btn.next::after {
            content: '→';
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-jade));
            transition: width 0.3s ease;
        }

        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 60px;
            right: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            width: 280px;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .settings-panel.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .settings-title {
            font-size: 16px;
            color: var(--accent-gold);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .settings-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: block;
        }

        .settings-options {
            display: flex;
            gap: 8px;
        }

        .settings-option {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .settings-option:hover, .settings-option.active {
            background: rgba(212, 165, 116, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* 目录面板 */
        .toc-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 350px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            z-index: 300;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .toc-panel.visible {
            transform: translateX(0);
        }

        .toc-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toc-title {
            font-size: 18px;
            color: var(--accent-gold);
        }

        .toc-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .toc-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .toc-volume {
            margin-bottom: 20px;
        }

        .toc-volume-title {
            font-size: 15px;
            color: var(--accent-gold);
            padding: 10px 15px;
            background: rgba(212, 165, 116, 0.1);
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .toc-chapters {
            padding-left: 15px;
        }

        .toc-chapter {
            padding: 8px 12px;
            font-size: 14px;
            color: var(--text-secondary);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toc-chapter:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .toc-chapter.current {
            background: rgba(212, 165, 116, 0.15);
            color: var(--accent-gold);
        }

        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 250;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .main-content {
                padding: 80px 20px 120px;
            }
            .chapter-title {
                font-size: 24px;
            }
            :root {
                --font-size-base: 16px;
            }
            .toc-panel {
                width: 100%;
            }
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header id="header">
        <div class="progress-bar" id="progressBar"></div>
        <div class="header-content">
            <div class="header-left">
                <a href="index.html" class="back-btn">← 返回</a>
                <span class="current-position" id="currentPosition">第1卷 第1回</span>
            </div>
            <div class="header-right">
                <button class="icon-btn" onclick="toggleTOC()" title="目录">☰</button>
                <button class="icon-btn" onclick="toggleSettings()" title="设置">⚙</button>
            </div>
        </div>
    </header>

    <main class="main-content" id="mainContent">
        <article class="chapter-content" id="chapterContent">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在加载...</p>
            </div>
        </article>
    </main>

    <nav class="chapter-nav" id="chapterNav">
        <button class="nav-btn prev" id="prevBtn" onclick="prevChapter()">上一回</button>
        <button class="nav-btn next" id="nextBtn" onclick="nextChapter()">下一回</button>
    </nav>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-title">阅读设置</div>
        
        <div class="settings-group">
            <label class="settings-label">字体大小</label>
            <div class="settings-options">
                <button class="settings-option" onclick="setFontSize(14)">小</button>
                <button class="settings-option active" onclick="setFontSize(18)">中</button>
                <button class="settings-option" onclick="setFontSize(22)">大</button>
                <button class="settings-option" onclick="setFontSize(26)">特大</button>
            </div>
        </div>

        <div class="settings-group">
            <label class="settings-label">背景颜色</label>
            <div class="settings-options">
                <button class="settings-option active" onclick="setBackground('#0a0a0f')" style="background: #0a0a0f;"></button>
                <button class="settings-option" onclick="setBackground('#1a1a2e')" style="background: #1a1a2e;"></button>
                <button class="settings-option" onclick="setBackground('#f5f5dc')" style="background: #f5f5dc; color: #333;"></button>
                <button class="settings-option" onclick="setBackground('#e8f5e9')" style="background: #e8f5e9; color: #333;"></button>
            </div>
        </div>
    </div>

    <!-- 目录面板 -->
    <div class="toc-panel" id="tocPanel">
        <div class="toc-header">
            <span class="toc-title">目录</span>
            <button class="toc-close" onclick="toggleTOC()">×</button>
        </div>
        <div class="toc-content" id="tocContent">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- 遮罩 -->
    <div class="overlay" id="overlay" onclick="closeAllPanels()"></div>

    <script>
        // 全局状态
        let currentVolume = 1;
        let currentChapter = 1;
        let totalVolumes = 28;
        let chaptersData = [];

        // 获取URL参数
        function getURLParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                volume: parseInt(params.get('volume')) || 1,
                chapter: parseInt(params.get('chapter')) || 1
            };
        }

        // 初始化
        async function init() {
            const params = getURLParams();
            currentVolume = params.volume;
            currentChapter = params.chapter;

            await loadTOC();
            await loadChapter(currentVolume, currentChapter);
            loadReadingProgress();
            setupScrollProgress();
        }

        // 加载目录
        async function loadTOC() {
            try {
                const response = await fetch('../novel_reader/index.json');
                const data = await response.json();
                chaptersData = data.volumes;
                totalVolumes = data.total_volumes;
                renderTOC(data.volumes);
            } catch (error) {
                console.error('Failed to load TOC:', error);
            }
        }

        // 渲染目录
        function renderTOC(volumes) {
            const tocContent = document.getElementById('tocContent');
            
            tocContent.innerHTML = volumes.map(vol => `
                <div class="toc-volume">
                    <div class="toc-volume-title" onclick="toggleVolume(this)">
                        第${vol.volume}卷 ${vol.chapters ? `(${vol.chapters.length}回)` : ''}
                    </div>
                    <div class="toc-chapters" style="display: ${vol.volume === currentVolume ? 'block' : 'none'}">
                        ${(vol.chapters || []).map(ch => `
                            <div class="toc-chapter ${ch.chapter === currentChapter && vol.volume === currentVolume ? 'current' : ''}"
                                 onclick="goToChapter(${vol.volume}, ${ch.chapter})">
                                ${ch.title || '第' + ch.chapter + '回'}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 展开/折叠卷
        function toggleVolume(el) {
            const chapters = el.nextElementSibling;
            chapters.style.display = chapters.style.display === 'none' ? 'block' : 'none';
        }

        // 跳转到章节
        function goToChapter(volume, chapter) {
            window.location.href = `reader.html?volume=${volume}&chapter=${chapter}`;
        }

        // 加载章节内容
        async function loadChapter(volume, chapter) {
            const contentEl = document.getElementById('chapterContent');
            const positionEl = document.getElementById('currentPosition');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            contentEl.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载第${volume}卷 第${chapter}回...</p>
                </div>
            `;

            try {
                const response = await fetch(`../novel_reader/chapters/volume_${String(volume).padStart(2, '0')}/chapter_${String(chapter).padStart(3, '0')}.json`);
                const data = await response.json();

                // 更新位置显示
                positionEl.textContent = `第${volume}卷 第${chapter}回`;

                // 渲染内容
                let html = `<div class="chapter-header">
                    <h1 class="chapter-title">${data.title}</h1>
                    <div class="chapter-meta">第${volume}卷</div>
                </div>`;

                // 处理文本内容，分段显示
                const paragraphs = data.content.split('\n').filter(p => p.trim());
                paragraphs.forEach(p => {
                    // 检测是否为标题（小标题）
                    if (p.length < 20 && !p.includes('，') && !p.includes('。') && !p.includes('"') && !p.includes('"')) {
                        html += `<h2 style="font-size: 20px; color: var(--accent-gold); margin: 30px 0 20px; text-align: center; text-indent: 0;">${p}</h2>`;
                    } else {
                        html += `<p>${p}</p>`;
                    }
                });

                // 添加图片
                if (data.images && data.images.length > 0) {
                    data.images.forEach((img, idx) => {
                        html += `
                            <figure style="margin: 40px 0; text-align: center;">
                                <img src="../novel_reader/${img}" alt="插图${idx + 1}" class="chapter-image" 
                                     onerror="this.style.display='none'">
                            </figure>
                        `;
                    });
                }

                contentEl.innerHTML = html;

                // 更新导航按钮
                updateNavButtons(volume, chapter);

                // 保存阅读进度
                saveReadingProgress(volume, chapter);

            } catch (error) {
                console.error('Failed to load chapter:', error);
                contentEl.innerHTML = `
                    <div class="loading">
                        <p>加载失败，请返回目录重试</p>
                    </div>
                `;
            }
        }

        // 更新导航按钮
        function updateNavButtons(volume, chapter) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            // 查找当前卷章节数
            let currentVolData = chaptersData.find(v => v.volume === volume);
            let chapterCount = currentVolData?.chapters?.length || 10;

            // 上一回
            if (chapter > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => goToChapter(volume, chapter - 1);
            } else if (volume > 1) {
                // 上一卷最后一回
                let prevVolData = chaptersData.find(v => v.volume === volume - 1);
                let prevChapterCount = prevVolData?.chapters?.length || 10;
                prevBtn.disabled = false;
                prevBtn.onclick = () => goToChapter(volume - 1, prevChapterCount);
            } else {
                prevBtn.disabled = true;
            }

            // 下一回
            if (chapter < chapterCount) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => goToChapter(volume, chapter + 1);
            } else if (volume < totalVolumes) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => goToChapter(volume + 1, 1);
            } else {
                nextBtn.disabled = true;
            }
        }

        // 上一章
        function prevChapter() {
            const params = getURLParams();
            let vol = params.volume;
            let ch = params.chapter - 1;

            if (ch < 1) {
                vol--;
                if (vol < 1) {
                    vol = 1;
                    ch = 1;
                } else {
                    let prevVolData = chaptersData.find(v => v.volume === vol);
                    ch = prevVolData?.chapters?.length || 10;
                }
            }

            goToChapter(vol, ch);
        }

        // 下一章
        function nextChapter() {
            const params = getURLParams();
            let vol = params.volume;
            let ch = params.chapter + 1;

            let currentVolData = chaptersData.find(v => v.volume === vol);
            let chapterCount = currentVolData?.chapters?.length || 10;

            if (ch > chapterCount) {
                vol++;
                ch = 1;
                if (vol > totalVolumes) {
                    vol = totalVolumes;
                    ch = chapterCount;
                }
            }

            goToChapter(vol, ch);
        }

        // 保存阅读进度
        function saveReadingProgress(volume, chapter) {
            localStorage.setItem('readingProgress', JSON.stringify({ volume, chapter }));
        }

        // 加载阅读进度
        function loadReadingProgress() {
            // 不自动跳转，只在首页使用
        }

        // 设置滚动进度
        function setupScrollProgress() {
            const progressBar = document.getElementById('progressBar');
            const header = document.getElementById('header');

            window.addEventListener('scroll', () => {
                const scrollTop = window.scrollY;
                const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                const progress = (scrollTop / docHeight) * 100;
                progressBar.style.width = progress + '%';

                // 自动隐藏头部
                if (scrollTop > 100) {
                    header.classList.add('hidden');
                } else {
                    header.classList.remove('hidden');
                }
            });
        }

        // 切换目录面板
        function toggleTOC() {
            const panel = document.getElementById('tocPanel');
            const overlay = document.getElementById('overlay');
            panel.classList.toggle('visible');
            overlay.classList.toggle('visible');
        }

        // 切换设置面板
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('visible');
        }

        // 关闭所有面板
        function closeAllPanels() {
            document.getElementById('tocPanel').classList.remove('visible');
            document.getElementById('settingsPanel').classList.remove('visible');
            document.getElementById('overlay').classList.remove('visible');
        }

        // 设置字体大小
        function setFontSize(size) {
            document.documentElement.style.setProperty('--font-size-base', size + 'px');
            document.querySelectorAll('.settings-option').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // 设置背景颜色
        function setBackground(color) {
            document.body.style.background = color;
            document.querySelectorAll('.settings-option').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // 初始化
        init();
    </script>
</body>
</html>
