<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读 - 逍遥小散仙（角色标注版）</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --bg-hover: #22222f;
            --text-primary: #e8e4dc;
            --text-secondary: #a09888;
            --text-muted: #666;
            --accent-gold: #d4a574;
            --accent-jade: #5a9a8f;
            --accent-crimson: #c75b5b;
            --border-color: #2a2a3a;
            --font-size-base: 18px;
            --line-height: 2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: var(--line-height);
            font-size: var(--font-size-base);
        }

        /* 头部导航 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }

        header.hidden {
            transform: translateY(-100%);
        }

        .header-content {
            max-width: 100%;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--accent-gold);
        }

        .current-position {
            font-size: 14px;
            color: var(--accent-gold);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
        }

        .icon-btn:hover {
            background: rgba(212, 165, 116, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .icon-btn.active {
            background: rgba(212, 165, 116, 0.2);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* 主内容区 */
        .main-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 100px 30px 150px;
        }

        /* 章节标题 */
        .chapter-header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .chapter-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 15px;
            letter-spacing: 5px;
        }

        .chapter-meta {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* 章节内容 */
        .chapter-content {
            text-align: justify;
            text-indent: 2em;
        }

        .chapter-content p {
            margin-bottom: 1.5em;
            line-height: 2;
        }

        /* 角色高亮样式 */
        .character {
            color: var(--accent-gold);
            cursor: pointer;
            border-bottom: 1px dashed var(--accent-gold);
            transition: all 0.2s ease;
            position: relative;
        }

        .character:hover {
            background: rgba(212, 165, 116, 0.15);
            border-bottom-style: solid;
        }

        .character.female {
            color: var(--accent-crimson);
            border-bottom-color: var(--accent-crimson);
        }

        .character.female:hover {
            background: rgba(199, 91, 91, 0.15);
        }

        .character.male {
            color: var(--accent-jade);
            border-bottom-color: var(--accent-jade);
        }

        .character.male:hover {
            background: rgba(90, 154, 143, 0.15);
        }

        /* 角色卡片弹窗 */
        .character-card {
            position: fixed;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 0;
            width: 380px;
            max-height: 500px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .character-card.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .card-header {
            padding: 20px;
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.1), rgba(90, 154, 143, 0.05));
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .card-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-jade));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: var(--bg-primary);
            flex-shrink: 0;
            overflow: hidden;
        }

        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-avatar.female {
            background: linear-gradient(135deg, var(--accent-crimson), var(--accent-gold));
        }

        .card-info {
            flex: 1;
        }

        .card-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 5px;
        }

        .card-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .card-type {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(212, 165, 116, 0.15);
            border-radius: 10px;
            font-size: 11px;
            color: var(--accent-gold);
            margin-top: 5px;
        }

        .card-type.core {
            background: rgba(212, 165, 116, 0.2);
            color: var(--accent-gold);
        }

        .card-type.minor {
            background: rgba(150, 150, 150, 0.15);
            color: var(--text-secondary);
        }

        .card-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s;
        }

        .card-close:hover {
            background: rgba(212, 165, 116, 0.2);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .card-body {
            padding: 20px;
            max-height: 350px;
            overflow-y: auto;
        }

        .card-section {
            margin-bottom: 20px;
        }

        .card-section:last-child {
            margin-bottom: 0;
        }

        .card-section-title {
            font-size: 13px;
            color: var(--accent-gold);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-section-content {
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1.8;
        }

        .card-aliases {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .alias-tag {
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .card-relationships {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 13px;
        }

        .rel-type {
            padding: 2px 8px;
            background: rgba(212, 165, 116, 0.15);
            border-radius: 10px;
            color: var(--accent-gold);
            font-size: 11px;
            white-space: nowrap;
        }

        .rel-with {
            color: var(--text-primary);
            font-weight: 500;
        }

        .rel-desc {
            color: var(--text-secondary);
            font-size: 12px;
            margin-left: auto;
        }

        /* 章节图片 */
        .chapter-image {
            display: block;
            max-width: 100%;
            margin: 30px auto;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* 章节导航 */
        .chapter-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(212, 165, 116, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-jade));
            transition: width 0.3s ease;
        }

        /* 设置面板 */
        .settings-panel {
            position: fixed;
            top: 60px;
            right: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            width: 280px;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .settings-panel.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .settings-title {
            font-size: 16px;
            color: var(--accent-gold);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .settings-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: block;
        }

        .settings-options {
            display: flex;
            gap: 8px;
        }

        .settings-option {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .settings-option:hover, .settings-option.active {
            background: rgba(212, 165, 116, 0.1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        /* 目录面板 */
        .toc-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 350px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            z-index: 300;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .toc-panel.visible {
            transform: translateX(0);
        }

        .toc-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toc-title {
            font-size: 18px;
            color: var(--accent-gold);
        }

        .toc-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .toc-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .toc-volume {
            margin-bottom: 20px;
        }

        .toc-volume-title {
            font-size: 15px;
            color: var(--accent-gold);
            padding: 10px 15px;
            background: rgba(212, 165, 116, 0.1);
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .toc-chapters {
            padding-left: 15px;
        }

        .toc-chapter {
            padding: 8px 12px;
            font-size: 14px;
            color: var(--text-secondary);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toc-chapter:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .toc-chapter.current {
            background: rgba(212, 165, 116, 0.15);
            color: var(--accent-gold);
        }

        /* 遮罩 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 250;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .main-content {
                padding: 80px 20px 120px;
            }
            .chapter-title {
                font-size: 24px;
            }
            :root {
                --font-size-base: 16px;
            }
            .toc-panel {
                width: 100%;
            }
            .character-card {
                width: 90%;
                left: 5% !important;
                right: 5% !important;
            }
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 角色标注开关提示 */
        .annotation-hint {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--accent-gold);
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 13px;
            color: var(--accent-gold);
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .annotation-hint.visible {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    <header id="header">
        <div class="progress-bar" id="progressBar"></div>
        <div class="header-content">
            <div class="header-left">
                <a href="index.html" class="back-btn">← 返回</a>
                <span class="current-position" id="currentPosition">第1卷 第1回</span>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="annotationBtn" onclick="toggleAnnotation()" title="角色标注">👤</button>
                <button class="icon-btn" onclick="toggleTOC()" title="目录">☰</button>
                <button class="icon-btn" onclick="toggleSettings()" title="设置">⚙</button>
            </div>
        </div>
    </header>

    <main class="main-content" id="mainContent">
        <article class="chapter-content" id="chapterContent">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>正在加载...</p>
            </div>
        </article>
    </main>

    <nav class="chapter-nav" id="chapterNav">
        <button class="nav-btn prev" id="prevBtn" onclick="prevChapter()">上一回</button>
        <button class="nav-btn next" id="nextBtn" onclick="nextChapter()">下一回</button>
    </nav>

    <!-- 角色标注提示 -->
    <div class="annotation-hint" id="annotationHint">
        点击文中高亮的角色名查看详细信息
    </div>

    <!-- 角色卡片弹窗 -->
    <div class="character-card" id="characterCard">
        <button class="card-close" onclick="closeCharacterCard()">×</button>
        <div id="cardContent">
            <!-- 动态加载 -->
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-title">阅读设置</div>
        
        <div class="settings-group">
            <label class="settings-label">字体大小</label>
            <div class="settings-options">
                <button class="settings-option" onclick="setFontSize(14)">小</button>
                <button class="settings-option active" onclick="setFontSize(18)">中</button>
                <button class="settings-option" onclick="setFontSize(22)">大</button>
                <button class="settings-option" onclick="setFontSize(26)">特大</button>
            </div>
        </div>

        <div class="settings-group">
            <label class="settings-label">背景颜色</label>
            <div class="settings-options">
                <button class="settings-option active" onclick="setBackground('#0a0a0f')" style="background: #0a0a0f;"></button>
                <button class="settings-option" onclick="setBackground('#1a1a2e')" style="background: #1a1a2e;"></button>
                <button class="settings-option" onclick="setBackground('#f5f5dc')" style="background: #f5f5dc; color: #333;"></button>
                <button class="settings-option" onclick="setBackground('#e8f5e9')" style="background: #e8f5e9; color: #333;"></button>
            </div>
        </div>
    </div>

    <!-- 目录面板 -->
    <div class="toc-panel" id="tocPanel">
        <div class="toc-header">
            <span class="toc-title">目录</span>
            <button class="toc-close" onclick="toggleTOC()">×</button>
        </div>
        <div class="toc-content" id="tocContent"></div>
    </div>

    <!-- 遮罩 -->
    <div class="overlay" id="overlay" onclick="closeAllPanels()"></div>

    <script>
        // 全局状态
        let currentVolume = 1;
        let currentChapter = 1;
        let totalVolumes = 28;
        let chaptersData = [];
        let charactersData = {};
        let annotationEnabled = true;
        let characterNames = [];

        // 获取URL参数
        function getURLParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                volume: parseInt(params.get('volume')) || 1,
                chapter: parseInt(params.get('chapter')) || 1
            };
        }

        // 初始化
        async function init() {
            const params = getURLParams();
            currentVolume = params.volume;
            currentChapter = params.chapter;

            await Promise.all([
                loadTOC(),
                loadCharacters()
            ]);
            
            await loadChapter(currentVolume, currentChapter);
            setupScrollProgress();
            
            // 设置标注按钮初始状态
            const annotationBtn = document.getElementById('annotationBtn');
            if (annotationBtn && annotationEnabled) {
                annotationBtn.classList.add('active');
            }
            
            // 显示标注提示
            setTimeout(() => {
                document.getElementById('annotationHint').classList.add('visible');
                setTimeout(() => {
                    document.getElementById('annotationHint').classList.remove('visible');
                }, 5000);
            }, 1000);
        }

        // 加载角色数据库
        async function loadCharacters() {
            try {
                const response = await fetch('characters_db.json');
                charactersData = await response.json();
                
                // 构建角色名列表（包括别名）
                characterNames = [];
                for (const [name, data] of Object.entries(charactersData)) {
                    characterNames.push(name);
                    if (data.aliases) {
                        characterNames.push(...data.aliases);
                    }
                }
                // 按长度排序，优先匹配长名字
                characterNames.sort((a, b) => b.length - a.length);
                
                console.log(`Loaded ${Object.keys(charactersData).length} characters`);
                console.log(`Character names for annotation: ${characterNames.length}`);
                console.log('Sample names:', characterNames.slice(0, 10));
            } catch (error) {
                console.error('Failed to load characters:', error);
            }
        }

        // 标注角色名
        function annotateCharacters(text) {
            if (!annotationEnabled) {
                console.log('Annotation disabled');
                return text;
            }
            
            if (Object.keys(charactersData).length === 0) {
                console.log('No character data loaded');
                return text;
            }

            // 构建角色名到主名的映射（包括别名）
            const nameToMainMap = {};
            for (const [mainName, data] of Object.entries(charactersData)) {
                nameToMainMap[mainName] = { mainName, data };
                if (data.aliases) {
                    for (const alias of data.aliases) {
                        nameToMainMap[alias] = { mainName, data };
                    }
                }
            }
            
            // 按长度排序，优先匹配长名字
            const sortedNames = Object.keys(nameToMainMap).sort((a, b) => b.length - a.length);
            
            // 转义所有名字用于正则表达式
            const escapedNames = sortedNames.map(name => 
                name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            );
            
            // 收集所有匹配位置
            const matches = [];
            const groupSize = 200;
            
            for (let i = 0; i < escapedNames.length; i += groupSize) {
                const group = escapedNames.slice(i, i + groupSize);
                try {
                    const pattern = new RegExp(`(${group.join('|')})`, 'g');
                    let match;
                    while ((match = pattern.exec(text)) !== null) {
                        matches.push({
                            index: match.index,
                            length: match[0].length,
                            text: match[0]
                        });
                        // 防止零长度匹配导致无限循环
                        if (match.index === pattern.lastIndex) {
                            pattern.lastIndex++;
                        }
                    }
                } catch (e) {
                    console.error('Regex error:', e);
                }
            }
            
            // 按位置排序，并移除重叠的匹配（优先保留长的）
            matches.sort((a, b) => a.index - b.index);
            const filteredMatches = [];
            let lastEnd = -1;
            
            for (const match of matches) {
                if (match.index >= lastEnd) {
                    filteredMatches.push(match);
                    lastEnd = match.index + match.length;
                }
            }
            
            // 构建结果字符串
            let result = '';
            let lastIndex = 0;
            
            for (const match of filteredMatches) {
                // 添加匹配前的文本
                result += text.slice(lastIndex, match.index);
                
                // 添加标注后的角色名
                const mapping = nameToMainMap[match.text];
                if (mapping) {
                    const { mainName, data } = mapping;
                    const genderClass = data.gender === '女' ? 'female' : (data.gender === '男' ? 'male' : '');
                    result += `<span class="character ${genderClass}" data-name="${mainName}" onclick="showCharacterCard('${mainName}', event)">${match.text}</span>`;
                } else {
                    result += match.text;
                }
                
                lastIndex = match.index + match.length;
            }
            
            // 添加剩余文本
            result += text.slice(lastIndex);
            
            return result;
        }

        // 显示角色卡片
        function showCharacterCard(name, event) {
            event.stopPropagation();
            
            const char = charactersData[name];
            if (!char) return;

            const card = document.getElementById('characterCard');
            const content = document.getElementById('cardContent');

            // 构建卡片内容
            const genderClass = char.gender === '女' ? 'female' : '';
            const typeLabel = char.type === 'core' ? '核心角色' : '次要角色';
            const typeClass = char.type;

            let html = `
                <div class="card-header">
                    <div class="card-avatar ${genderClass}">
                        ${char.image ? `<img src="${char.image}" alt="${name}" onerror="this.style.display='none'; this.parentElement.textContent='${name[0]}';">` : name[0]}
                    </div>
                    <div class="card-info">
                        <div class="card-name">${name}</div>
                        <div class="card-meta">${char.faction || '未知势力'} · ${char.gender || '未知'}</div>
                        <span class="card-type ${typeClass}">${typeLabel}</span>
                    </div>
                </div>
                <div class="card-body">
            `;

            // 别名
            if (char.aliases && char.aliases.length > 0) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">别名</div>
                        <div class="card-aliases">
                            ${char.aliases.map(a => `<span class="alias-tag">${a}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            // 简介
            if (char.description) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">简介</div>
                        <div class="card-section-content">${char.description}</div>
                    </div>
                `;
            }

            // 性格
            if (char.personality) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">性格特点</div>
                        <div class="card-section-content">${char.personality}</div>
                    </div>
                `;
            }

            // 外貌
            if (char.appearance) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">外貌特征</div>
                        <div class="card-section-content">${char.appearance}</div>
                    </div>
                `;
            }

            // 功法
            if (char.cultivation) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">功法修为</div>
                        <div class="card-section-content">${char.cultivation}</div>
                    </div>
                `;
            }

            // 兵器
            if (char.weapons) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">兵器</div>
                        <div class="card-section-content">${char.weapons}</div>
                    </div>
                `;
            }

            // 法宝
            if (char.items) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">法宝</div>
                        <div class="card-section-content">${char.items}</div>
                    </div>
                `;
            }

            // 坐骑
            if (char.mount) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">坐骑</div>
                        <div class="card-section-content">${char.mount}</div>
                    </div>
                `;
            }

            // 法术/武技
            if (char.techniques) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">法术武技</div>
                        <div class="card-section-content">${char.techniques}</div>
                    </div>
                `;
            }

            // 机关
            if (char.machines) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">机关</div>
                        <div class="card-section-content">${char.machines}</div>
                    </div>
                `;
            }

            // 符箓
            if (char.talismans) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">符箓</div>
                        <div class="card-section-content">${char.talismans}</div>
                    </div>
                `;
            }

            // 阵法
            if (char.formation) {
                html += `
                    <div class="card-section">
                        <div class="card-section-title">阵法</div>
                        <div class="card-section-content">${char.formation}</div>
                    </div>
                `;
            }

            // 关系
            if (char.relationships && char.relationships.length > 0) {
                const topRels = char.relationships.slice(0, 5);
                html += `
                    <div class="card-section">
                        <div class="card-section-title">人物关系</div>
                        <div class="card-relationships">
                            ${topRels.map(r => `
                                <div class="rel-item">
                                    <span class="rel-type">${r.type_cn || r.type}</span>
                                    <span class="rel-with">${r.with}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            content.innerHTML = html;

            // 定位卡片
            const rect = event.target.getBoundingClientRect();
            let left = rect.left + rect.width / 2 - 190;
            let top = rect.bottom + 10;

            // 边界检查
            if (left < 10) left = 10;
            if (left + 380 > window.innerWidth) left = window.innerWidth - 390;
            if (top + 400 > window.innerHeight) top = rect.top - 410;

            card.style.left = left + 'px';
            card.style.top = top + 'px';
            card.classList.add('visible');
        }

        // 关闭角色卡片
        function closeCharacterCard() {
            document.getElementById('characterCard').classList.remove('visible');
        }

        // 切换角色标注
        function toggleAnnotation() {
            annotationEnabled = !annotationEnabled;
            const btn = document.getElementById('annotationBtn');
            btn.classList.toggle('active', annotationEnabled);
            
            // 重新加载当前章节
            loadChapter(currentVolume, currentChapter);
            
            // 显示提示
            const hint = document.getElementById('annotationHint');
            hint.textContent = annotationEnabled ? '角色标注已开启' : '角色标注已关闭';
            hint.classList.add('visible');
            setTimeout(() => hint.classList.remove('visible'), 2000);
        }

        // 加载目录
        async function loadTOC() {
            try {
                const response = await fetch('../novel_reader/index.json');
                const data = await response.json();
                chaptersData = data.volumes;
                totalVolumes = data.total_volumes;
                renderTOC(data.volumes);
            } catch (error) {
                console.error('Failed to load TOC:', error);
            }
        }

        // 渲染目录
        function renderTOC(volumes) {
            const tocContent = document.getElementById('tocContent');
            
            tocContent.innerHTML = volumes.map(vol => `
                <div class="toc-volume">
                    <div class="toc-volume-title" onclick="toggleVolume(this)">
                        第${vol.volume}卷 ${vol.chapters ? `(${vol.chapters.length}回)` : ''}
                    </div>
                    <div class="toc-chapters" style="display: ${vol.volume === currentVolume ? 'block' : 'none'}">
                        ${(vol.chapters || []).map(ch => `
                            <div class="toc-chapter ${ch.chapter === currentChapter && vol.volume === currentVolume ? 'current' : ''}"
                                 onclick="goToChapter(${vol.volume}, ${ch.chapter})">
                                ${ch.index_title || '第' + ch.chapter + '回'}${ch.title && ch.title !== ch.index_title ? ' ' + ch.title : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // 展开/折叠卷
        function toggleVolume(el) {
            const chapters = el.nextElementSibling;
            chapters.style.display = chapters.style.display === 'none' ? 'block' : 'none';
        }

        // 跳转到章节
        function goToChapter(volume, chapter) {
            window.location.href = `reader_v2.html?volume=${volume}&chapter=${chapter}`;
        }

        // 加载章节内容
        async function loadChapter(volume, chapter) {
            const contentEl = document.getElementById('chapterContent');
            const positionEl = document.getElementById('currentPosition');

            contentEl.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在加载第${volume}卷 第${chapter}回...</p>
                </div>
            `;

            try {
                const response = await fetch(`../novel_reader/chapters/volume_${String(volume).padStart(2, '0')}/chapter_${String(chapter).padStart(3, '0')}.json`);
                const data = await response.json();

                positionEl.textContent = `第${volume}卷 第${chapter}回`;

                // 渲染内容
                let html = `<div class="chapter-header">
                    <h1 class="chapter-title">${data.title}</h1>
                    <div class="chapter-meta">第${volume}卷</div>
                </div>`;

                // 处理文本内容，分段显示并进行角色标注
                const paragraphs = data.content.split('\n').filter(p => p.trim());
                paragraphs.forEach(p => {
                    if (p.length < 20 && !p.includes('，') && !p.includes('。') && !p.includes('"')) {
                        html += `<h2 style="font-size: 20px; color: var(--accent-gold); margin: 30px 0 20px; text-align: center; text-indent: 0;">${annotateCharacters(p)}</h2>`;
                    } else {
                        const annotated = annotateCharacters(p);
                        html += `<p>${annotated}</p>`;
                    }
                });

                // 添加图片
                if (data.images && data.images.length > 0) {
                    data.images.forEach((img, idx) => {
                        html += `
                            <figure style="margin: 40px 0; text-align: center;">
                                <img src="../novel_reader/${img}" alt="插图${idx + 1}" class="chapter-image" 
                                     onerror="this.style.display='none'">
                            </figure>
                        `;
                    });
                }

                contentEl.innerHTML = html;
                updateNavButtons(volume, chapter);
                saveReadingProgress(volume, chapter);

            } catch (error) {
                console.error('Failed to load chapter:', error);
                contentEl.innerHTML = `<div class="loading"><p>加载失败</p></div>`;
            }
        }

        // 更新导航按钮
        function updateNavButtons(volume, chapter) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            let currentVolData = chaptersData.find(v => v.volume === volume);
            let chapterCount = currentVolData?.chapters?.length || 10;

            if (chapter > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => goToChapter(volume, chapter - 1);
            } else if (volume > 1) {
                let prevVolData = chaptersData.find(v => v.volume === volume - 1);
                let prevChapterCount = prevVolData?.chapters?.length || 10;
                prevBtn.disabled = false;
                prevBtn.onclick = () => goToChapter(volume - 1, prevChapterCount);
            } else {
                prevBtn.disabled = true;
            }

            if (chapter < chapterCount) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => goToChapter(volume, chapter + 1);
            } else if (volume < totalVolumes) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => goToChapter(volume + 1, 1);
            } else {
                nextBtn.disabled = true;
            }
        }

        // 上一章/下一章
        function prevChapter() {
            const params = getURLParams();
            let vol = params.volume;
            let ch = params.chapter - 1;
            if (ch < 1) {
                vol--;
                if (vol < 1) { vol = 1; ch = 1; }
                else {
                    let prevVolData = chaptersData.find(v => v.volume === vol);
                    ch = prevVolData?.chapters?.length || 10;
                }
            }
            goToChapter(vol, ch);
        }

        function nextChapter() {
            const params = getURLParams();
            let vol = params.volume;
            let ch = params.chapter + 1;
            let currentVolData = chaptersData.find(v => v.volume === vol);
            let chapterCount = currentVolData?.chapters?.length || 10;
            if (ch > chapterCount) {
                vol++; ch = 1;
                if (vol > totalVolumes) { vol = totalVolumes; ch = chapterCount; }
            }
            goToChapter(vol, ch);
        }

        // 保存阅读进度
        function saveReadingProgress(volume, chapter) {
            localStorage.setItem('readingProgress', JSON.stringify({ volume, chapter }));
        }

        // 设置滚动进度
        function setupScrollProgress() {
            const progressBar = document.getElementById('progressBar');
            const header = document.getElementById('header');

            window.addEventListener('scroll', () => {
                const scrollTop = window.scrollY;
                const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                const progress = (scrollTop / docHeight) * 100;
                progressBar.style.width = progress + '%';

                if (scrollTop > 100) {
                    header.classList.add('hidden');
                } else {
                    header.classList.remove('hidden');
                }
            });
        }

        // 面板控制
        function toggleTOC() {
            document.getElementById('tocPanel').classList.toggle('visible');
            document.getElementById('overlay').classList.toggle('visible');
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('visible');
        }

        function closeAllPanels() {
            document.getElementById('tocPanel').classList.remove('visible');
            document.getElementById('settingsPanel').classList.remove('visible');
            document.getElementById('overlay').classList.remove('visible');
            closeCharacterCard();
        }

        // 设置
        function setFontSize(size) {
            document.documentElement.style.setProperty('--font-size-base', size + 'px');
            document.querySelectorAll('#settingsPanel .settings-option').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function setBackground(color) {
            document.body.style.background = color;
            document.querySelectorAll('#settingsPanel .settings-option').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // 点击空白处关闭卡片
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.character-card') && !e.target.classList.contains('character')) {
                closeCharacterCard();
            }
        });

        // 初始化
        init();
    </script>
</body>
